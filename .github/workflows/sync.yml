name: market-data
on:
  schedule: [{cron: "*/5 12-22 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: true}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch.py
      - name: push data branch
        run: |
          mkdir /tmp/d && cp -r data/* /tmp/d/ && cd /tmp/d && git init -q -b data
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
